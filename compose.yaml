name: prequiz

services:
  # ── Firebase エミュレータ（Firestore + Auth）─────────────────────────
  # 本番の Firestore を汚さずに開発するための唯一のデータストア。
  # 起動には Java が必要なため専用イメージをビルドする。
  emulator:
    build:
      context: ./firebase
    container_name: prequiz-emulator
    ports:
      - "4000:4000" # Emulator UI
      - "8080:8080" # Firestore
      - "9099:9099" # Authentication
    volumes:
      - ./firebase/firebase.json:/opt/firebase/firebase.json:ro
      - ./firebase/firestore.rules:/opt/firebase/firestore.rules:ro
      - ./firebase/firestore.indexes.json:/opt/firebase/firestore.indexes.json:ro
      # エミュレータのデータを永続化（再起動してもルームや記事プールが残る）
      - emulator-data:/opt/firebase/.data
    environment:
      GCLOUD_PROJECT: ${FIREBASE_PROJECT_ID:-prequiz-local}
    # 終了時の書き出し（--export-on-exit）を待つ。記事プールが増えるほど
    # 時間がかかるので、既定の10秒では足りなくなる。
    # 途中で SIGKILL されると、その回のデータは丸ごと消える
    stop_grace_period: 60s
    healthcheck:
      # Firestore エミュレータが受け付け可能になるまで api を待たせる
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

  # ── バックエンド API（FastAPI）───────────────────────────────────────
  api:
    build:
      context: ./api
      target: dev
    container_name: prequiz-api
    ports:
      - "8000:8000"
    volumes:
      # ホットリロードのためソースをバインドマウント
      - ./api:/app
      # コンテナ内の依存関係をホストの空ディレクトリで潰さない
      - /app/.venv
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-prequiz-local}
      # この2つが設定されている限り Admin SDK は本番ではなくエミュレータを見る
      FIRESTORE_EMULATOR_HOST: emulator:8080
      FIREBASE_AUTH_EMULATOR_HOST: emulator:9099
      # モックかどうかはこの変数だけで決まる。既定はモック。
      # 実データ（Wikipedia + Gemini）を使うときだけ .env で false にする
      USE_MOCK: ${USE_MOCK:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      WIKIMEDIA_USER_AGENT: ${WIKIMEDIA_USER_AGENT:-}
      # 記事プール構築の合言葉。未設定なら手元でもその操作は通らない
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # 手元は同一オリジン（Vite と nginx が /api を api へ流す）なので
      # CORS は本来出番が無い。手で別オリジンから叩くとき用に残してある
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      emulator:
        condition: service_healthy

  # ── フロントエンド（Vite dev server）─────────────────────────────────
  web:
    build:
      context: ./web
      target: dev
    container_name: prequiz-web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      # VITE_API_BASE_URL は**あえて設定しない**。
      # 空なら同一オリジンの /api へ投げ、Vite（5173）と nginx（3000）が
      # それぞれ api コンテナへ流す。ここに http://localhost:8000 と書くと、
      # 撮影コンテナの中のブラウザから見た localhost が自分自身になって届かない。
      # 本番は Vercel と Cloud Run でオリジンが分かれるので、そちらでだけ設定する
      VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-prequiz-local}
      VITE_FIRESTORE_EMULATOR_HOST: localhost:8080
      VITE_AUTH_EMULATOR_URL: http://localhost:9099
    depends_on:
      - api

  # ── LP（本番と同じく `/` が LP、`/quiz` がゲーム）─────────────────────
  # 静的ファイルを配るだけの nginx。/quiz は web へ素通しする。
  # 本番の配置（vercel.json）を手元で再現するためのもので、
  # LP からゲームへの導線をここで確かめられる
  lp:
    image: nginx:1.27-alpine
    container_name: prequiz-lp
    ports:
      - "3000:80"
    volumes:
      - ./lp:/usr/share/nginx/html:ro
      - ./docs/lp-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  # ── LP 用スクリーンショット撮影（通常の起動には含めない）─────────────
  # docker compose --profile shots up --build shots
  shots:
    build:
      context: ./docs/shots-image
    profiles: ["shots"]
    volumes:
      # 撮影結果を lp/shots へ書き出すため、リポジトリごとマウントする
      - .:/work
    environment:
      BASE_URL: http://web:5173/quiz/
      OUT_DIR: /work/lp/shots
    depends_on:
      - web
      - api

volumes:
  emulator-data:
