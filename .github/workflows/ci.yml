name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチへ続けて push したとき、古い実行は打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff / mypy / pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: 依存をインストール
        working-directory: api
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 静的検査
        working-directory: api
        run: ruff check .

      - name: 型検査
        working-directory: api
        run: mypy --strict app

      # Firestore を触るテストは本番ではなくエミュレータ上で回す。
      # セキュリティルールの検証もここで担保する。
      - name: Firestore エミュレータを起動
        run: docker compose up -d --wait emulator

      - name: テスト
        working-directory: api
        env:
          FIREBASE_PROJECT_ID: prequiz-local
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
        # テストがまだ1つも無い状態（終了コード5）は失敗扱いにしない。
        # テストを書いたらこの行を `run: pytest` に戻す。
        run: pytest || [ $? -eq 5 ]

  web:
    name: Web (typecheck / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 依存をインストール
        working-directory: web
        run: npm ci

      - name: 型検査
        working-directory: web
        run: npm run typecheck

      - name: 本番ビルド
        working-directory: web
        run: npm run build
