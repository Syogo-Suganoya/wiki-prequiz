<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>1分間予習クイズ</title>
    <!-- LP と同じアイコン（public/ の3点は lp/ と同一ファイル）。
         同じ product だと一目で分かるよう、意図的に揃えている -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#16161C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root{
        --ink:#16161C; --paper:#F7F4EC; --white:#fff;
        --blue:#1E86D6; --yellow:#FFD21E; --red:#E8352B; --green:#25B75C;
        --line:3px solid var(--ink);
        --drop:5px 5px 0 var(--ink);
        --pop:"Dela Gothic One",sans-serif;
        --body:"Zen Maru Gothic",system-ui,sans-serif;
        color-scheme: light;
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;background:var(--paper);color:var(--ink);
        font-family:var(--body);font-weight:500;line-height:1.8;
        overflow:hidden; /* 画面はスクロールさせない */
      }
      #root{height:100%}

      /* 画面全体を 上バー / 本文 / 得点バー の3段に固定する */
      .app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
           background:var(--paper)}
      .body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
      .pad{padding:1rem;overflow-y:auto}
      /* 中身が収まるときだけ縦中央に寄せる。justify-content:center だと
         画面より高いときに上がはみ出て、スクロールしても戻せなくなる。
         margin:auto なら、あふれた時点で上詰めに戻る */
      /* flex:1 で本文いっぱいに広げないと、余白は .body 側に残ったままで
         .pad の中に配る隙間が生まれない */
      .pad-mid{flex:1;min-height:0;display:flex;flex-direction:column}
      .pad-mid>.mid{margin-block:auto;width:100%}
      .pad-x{padding-inline:1rem}
      .center{text-align:center}
      .hidden{display:none}

      .bar{display:flex;align-items:center;gap:.6rem;background:var(--ink);color:#fff;
           padding:.55rem .9rem;font-weight:900;font-size:.85rem;flex:none}
      .bar .timer{margin-left:auto;display:flex;align-items:center}
      /* 残り時間はアナログ時計の針で見せる。1周したら時間切れ。
         針は文字盤の中心を軸に回す（transform-box:fill-box にすると
         線自身の外接矩形が原点になり、中心からずれる） */
      .clock{width:34px;height:34px;display:block}
      .clock-face{fill:none;stroke:rgba(255,255,255,.35);stroke-width:2}
      .clock-needle{stroke:var(--yellow);stroke-width:2.6;stroke-linecap:round;
                    transform-box:view-box;transform-origin:20px 20px;
                    transition:transform .12s linear}
      .clock.urgent .clock-needle{stroke:var(--red)}
      .clock.urgent .clock-face{stroke:var(--red);opacity:.8}
      .bar .mode{background:var(--blue);padding:.1rem .6rem;border-radius:99px}
      /* 抜ける口。押し間違いが痛いので、ほかの操作から離れたバーの左端に置く */
      .quit{width:26px;height:26px;flex:none;padding:0;border:2px solid rgba(255,255,255,.5);
            border-radius:50%;background:none;color:#fff;font-family:inherit;font-weight:900;
            font-size:.9rem;line-height:1;cursor:pointer}
      .quit:hover{background:#fff;color:var(--ink)}

      /* ── 得点バー（下部固定）── */
      .scorebar{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:.3rem;
                padding:.5rem;background:var(--ink)}
      .sc-item{display:flex;align-items:center;gap:.4rem;background:#fff;
               border-radius:8px;padding:.25rem .5rem;font-size:.8rem;min-width:0}
      .sc-item.self{outline:3px solid var(--yellow)}
      .sc-item.hit{background:var(--yellow)}
      .sc-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .sc-item .sc{font-family:var(--pop);font-size:.85rem}
      .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);flex:none}

      /* ── 予習 ── */
      .study{display:flex;flex-direction:column;height:100%;min-height:0}
      .study-head{padding-top:.9rem;flex:none;text-align:center}
      .article{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
               margin:.6rem 1rem;padding:1rem;background:#fff;border:var(--line);
               border-radius:12px;white-space:pre-wrap;font-size:.95rem}
      .study-foot{flex:none;padding-block:.7rem}
      .skip{width:100%;padding:.6rem;font-family:inherit;font-weight:900;font-size:.85rem;
            background:#EDE9DE;border:2px dashed var(--ink);border-radius:10px;cursor:pointer}

      .title{font-family:var(--body);font-weight:900;font-size:1.45rem;margin:.35rem 0 0}
      .badge{display:inline-block;background:var(--yellow);border:2px solid var(--ink);
             border-radius:99px;padding:.15rem .85rem;font-weight:900;font-size:.82rem;margin:0}
      .q{font-family:var(--body);font-weight:900;font-size:1.3rem;margin:.9rem 0 1.1rem;line-height:1.55}

      .choices{display:grid;gap:.6rem}
      .choices button{display:flex;align-items:center;gap:.7rem;text-align:left;
                      padding:.85rem 1rem;font-family:inherit;font-weight:900;font-size:1.05rem;
                      background:#fff;border:var(--line);border-radius:12px;cursor:pointer;
                      box-shadow:var(--drop)}
      .choices button .label{flex:1;min-width:0}
      .choices button:active:not(:disabled){transform:translate(5px,5px);box-shadow:none}
      .choices button:disabled{opacity:.45;cursor:default;box-shadow:none}

      /* 選択肢の目印。色と形の両方で違えてあるので、色が見分けにくくても迷わない。
         数字はキーボードの割り当てとそろえてある（1〜4 で解答できる） */
      .mark{position:relative;width:34px;height:34px;flex:none;display:grid;place-items:center}
      .mark svg{position:absolute;inset:0;width:100%;height:100%}
      .mark b{position:relative;font-family:var(--pop);font-size:.8rem;line-height:1}

      .note{font-size:.82rem;opacity:.7;margin:.9rem 0 0}
      /* キーボードのある端末にだけ出す案内。端末の種類は CSS が知っているので、
         JS で matchMedia を見て state に持つ必要はない */
      .kbd{white-space:nowrap}
      @media (hover:none){.kbd{display:none}}
      /* 何秒差で負けたか。押せなかっただけだと勝負にならないので必ず出す */
      .behind{font-weight:900;font-size:.9rem;color:var(--red);margin:.9rem 0 0}
      .big.next{margin-top:1.4rem;margin-bottom:.2rem}
      .big:disabled{opacity:.5;box-shadow:none;transform:none;cursor:default}

      .verdict{font-family:var(--body);font-weight:900;font-size:1.1rem;margin:.5rem 0 .2rem}
      .verdict.ok{color:var(--green)} .verdict.ng{color:var(--red)}
      .delta{font-family:var(--pop);font-size:2rem;margin:0 0 .8rem;word-break:break-all}
      .delta.ok{color:var(--green)} .delta.ng{color:var(--red)}
      .exp{font-size:.92rem}

      /* ── 結果 ── */
      .result-title{font-family:var(--body);font-weight:900;font-size:1.5rem;margin:.5rem 0 1rem}
      .rank{list-style:none;padding:0;margin:0 0 1.2rem;text-align:left}
      .rank li{display:flex;align-items:center;gap:.55rem;background:#fff;border:2px solid var(--ink);
               border-radius:10px;padding:.6rem .8rem;margin-bottom:.5rem}
      .rank li.top{background:var(--yellow);border-width:3px}
      .rank .place{font-family:var(--pop);font-size:1.1rem;width:1.4em}
      .rank .nm{flex:1}
      .rank b{font-family:var(--pop);font-size:1rem}
      /* ひとりで遊んだときの結果。順位表の代わりに得点だけを大きく */
      .solo-score{border:3px solid var(--ink);border-radius:12px;background:#fff;
                  padding:1.1rem 1rem .6rem;margin:0 0 1.2rem;box-shadow:var(--drop)}
      .solo-score .note{margin:0}
      .solo-score .delta{font-size:2.6rem;margin:.2rem 0 0}

      /* ── ホーム ── */
      .logo{font-family:var(--pop);font-size:1.7rem;margin:1.2rem 0 1.5rem;text-align:center}
      .lead{font-weight:900;margin:.2rem 0 .6rem}
      .field{display:block;margin-bottom:1rem}
      .field>span{display:block;font-weight:900;font-size:.85rem;margin-bottom:.3rem}
      .field-label{display:flex!important;align-items:center;gap:.4rem}
      /* まるびっくり: 押すとモードの説明が出る */
      .help{width:20px;height:20px;flex:none;border-radius:50%;border:2px solid var(--ink);
            background:var(--yellow);font-family:var(--body);font-weight:900;font-size:.75rem;
            line-height:1;cursor:pointer;padding:0;color:var(--ink)}
      .help:hover{background:var(--ink);color:var(--yellow)}

      /* 設定画面への導線。今の設定を出しておき、押すと変えられる */
      .settings-link{display:flex;align-items:center;gap:.55rem;width:100%;margin-bottom:1.2rem;
                     padding:.7rem .9rem;font-family:inherit;font-weight:900;font-size:.9rem;
                     background:#fff;border:2px solid var(--ink);border-radius:12px;cursor:pointer}
      .settings-link:hover{background:#EDE9DE}
      .settings-link .gear{font-size:1.05rem;line-height:1}
      .settings-link .settings-cur{flex:1;text-align:left}
      .settings-link .settings-go{font-size:.8rem;opacity:.6}

      /* ── モーダル ── */
      .modal-bg{position:fixed;inset:0;background:rgba(22,22,28,.55);
                display:grid;place-items:center;padding:1rem;z-index:50}
      .modal{background:#fff;border:var(--line);border-radius:14px;box-shadow:var(--drop);
             padding:1.2rem;max-width:420px;width:100%;max-height:86vh;overflow-y:auto}
      .modal-title{font-family:var(--body);font-weight:900;font-size:1.25rem;margin:0 0 .2rem}
      .modal-lead{font-size:.88rem;margin:0 0 .7rem}
      .modal-item{border-top:2px solid var(--ink);padding-top:.5rem;margin-bottom:.7rem}
      .modal-item h3{font-family:var(--body);font-weight:900;font-size:1.02rem;margin:0 0 .1rem}
      .modal-formula{color:var(--red);font-weight:900;font-size:.9rem;margin:0 0 .2rem}
      .modal-note{font-size:.85rem;margin:0;opacity:.85;line-height:1.7}
      /* 説明を読み終えてから押すものなので、閉じるの手前だけは大きく空ける */
      .modal .big{margin:1.8rem 0 0}
      .modal .back{display:block;margin:.4rem auto 0}
      /* ── ニックネームの仕掛け ── */
      /* モーダル(50)より上に置く。ヘルプを開いたまま開始しても幕が勝つ */
      /* 元絵は「@ が濃い/. が薄い」の濃淡で描いてある。
         暗い背景に明るい文字だと明暗が反転して別人に見えるので、紙に墨で出す */
      .egg-bg{position:fixed;inset:0;background:var(--paper);color:var(--ink);
              display:flex;flex-direction:column;align-items:center;justify-content:center;
              gap:.6rem;overflow:hidden;z-index:80;cursor:pointer;animation:egg-in .18s ease-out}
      /* 絵は素の大きさのまま置き、実測した縮小率で JS が scale する。
         舞台側は高さを固定しておく（縮小しても行送りが乱れないよう絶対配置） */
      .egg-stage{position:relative;width:100%;height:72vh;flex:none}
      .egg-art{position:absolute;left:50%;top:50%;transform-origin:center;
               font-family:ui-monospace,Menlo,Consolas,monospace;
               font-size:10px;line-height:1;margin:0;white-space:pre;letter-spacing:0}
      .egg-line{font-family:var(--pop);font-size:1.1rem;margin:0;
                background:var(--yellow);border:var(--line);border-radius:99px;
                padding:.35rem 1.1rem;box-shadow:var(--drop)}
      @keyframes egg-in{from{opacity:0}to{opacity:1}}
      /* アニメーションが走らない環境で opacity:0 のまま残らないよう、明示的に切る */
      @media (prefers-reduced-motion:reduce){.egg-bg{animation:none}}

      input{width:100%;padding:.75rem;font-family:inherit;font-size:1rem;font-weight:700;
            border:var(--line);border-radius:10px;background:#fff}
      .chips{display:flex;gap:.5rem;flex-wrap:wrap}
      .chip{padding:.5rem 1rem;font-family:inherit;font-weight:900;background:#fff;
            border:var(--line);border-radius:99px;cursor:pointer}
      .chip.on{background:var(--blue);color:#fff}
      .big{width:100%;padding:1.05rem;font-family:var(--body);font-weight:900;font-size:1.15rem;
           background:var(--yellow);border:var(--line);border-radius:99px;box-shadow:var(--drop);
           cursor:pointer;margin-bottom:.9rem}
      .big.ghost{background:#fff}
      .big:active{transform:translate(5px,5px);box-shadow:none}
      .back{background:none;border:none;font-family:inherit;font-weight:900;font-size:.9rem;
            cursor:pointer;padding:.6rem;text-decoration:underline}
      .sep{text-align:center;font-size:.85rem;opacity:.6;margin:.2rem 0 1rem}
      .big-code{font-family:var(--pop);font-size:2.2rem;letter-spacing:.12em;margin:.2rem 0 1rem}
      .members{list-style:none;padding:0;margin:0 0 1rem;display:grid;gap:.4rem}
      .members li{display:flex;align-items:center;gap:.5rem;background:#fff;border:2px solid var(--ink);
                  border-radius:8px;padding:.4rem .7rem;font-weight:700}

      /* マッチング中 */
      .radar{width:88px;height:88px;margin:2.5rem auto 1.2rem;border-radius:50%;
             border:6px solid var(--blue);border-top-color:transparent;
             animation:spin 1s linear infinite;
             display:grid;place-items:center;font-size:2.2rem;color:var(--green);font-weight:900}
      .radar.found{border-color:var(--green);animation:none}
      @keyframes spin{to{transform:rotate(360deg)}}
      .matching{font-family:var(--body);font-weight:900;font-size:1.15rem;margin:0 0 .3rem}

      /* 最終結果: 今回読んだ記事へのリンク */
      .sources{text-align:left;border:2px solid var(--ink);border-radius:12px;
               padding:.9rem 1rem;margin:0 0 1.2rem;background:#fff}
      .sources h3{font-family:var(--body);font-weight:900;font-size:.92rem;margin:0 0 .5rem}
      .sources ul{list-style:none;padding:0;margin:0 0 .5rem}
      .sources li{margin-bottom:.35rem}
      .sources a{font-weight:900;color:var(--blue)}
      .sources .note{margin:0}

      .err{color:var(--red);font-weight:900}
      @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
