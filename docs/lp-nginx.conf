# ローカルで本番と同じ形に見せるための設定。
# `/` が LP、`/quiz` がゲーム。Vercel での配置（vercel.json）と合わせてある。
#
# 置き場が lp/ ではなく docs/ なのは、lp/ の中身がそのまま
# デプロイの出力になるため（vercel.json の `cp -R lp/. .out/`）。
# 設定ファイルを一緒に配ってしまわないよう、外に出してある。

server {
    listen 80;
    root /usr/share/nginx/html;   # lp/ をそのまま
    index index.html;

    # リダイレクト先を相対で返す。既定の絶対 URL だと、コンテナ内から見た
    # ホスト名（ポート無しの localhost）になってしまい、ブラウザが迷子になる
    absolute_redirect off;

    # Vercel は `/quiz` を `/quiz/index.html` として返すが、Vite の開発
    # サーバーは末尾スラッシュが無いと 404 になる。LP のリンクは本番に
    # 合わせて `/quiz` のままにしたいので、ここで吸収する
    location = /quiz {
        return 308 /quiz/;
    }

    # API も同じオリジンから引けるようにする。こうしておけば、
    # 手元では CORS が一切絡まない（本番は Cloud Run が別オリジンなので、
    # そちらは VITE_API_BASE_URL と CORS_ORIGINS で通す）
    location /api {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # ゲームは Vite の開発サーバーへ素通しする。
    # パスを書き換えないので、base=/quiz/ で出力されるアセットの URL
    # （/quiz/@vite/client など）がそのまま噛み合う
    location /quiz {
        proxy_pass http://web:5173;
        proxy_http_version 1.1;
        # HMR は WebSocket。この2行が無いと、保存しても画面が変わらない
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }
}
